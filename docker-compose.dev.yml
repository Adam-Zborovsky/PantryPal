# Local development infrastructure for PantryPal.
# Matches the credentials and ports already expected by .env / .env.example:
#   PostgreSQL  localhost:5432  (pantrypal/pantrypal, db: pantrypal)
#   Redis       localhost:6379
#   MinIO       localhost:9000 (console: http://localhost:9001)
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml down        # keeps data volumes

name: pantrypal-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: pantrypal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pantrypal
      POSTGRES_PASSWORD: pantrypal
      POSTGRES_DB: pantrypal
    ports:
      - "5432:5432"
    volumes:
      - pantrypal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pantrypal -d pantrypal"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pantrypal-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - pantrypal-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    container_name: pantrypal-minio
    restart: unless-stopped
    command: minio server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pantrypal
      MINIO_ROOT_PASSWORD: pantrypal-development-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - pantrypal-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: ensures the S3_BUCKET (pantrypal) exists on a fresh volume.
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: pantrypal-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 pantrypal pantrypal-development-secret &&
      mc mb --ignore-existing local/pantrypal
      "

volumes:
  pantrypal-postgres-data:
  pantrypal-redis-data:
  pantrypal-minio-data:
