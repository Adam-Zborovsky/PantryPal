services:
  pantrypal-api:
    build:
      context: ./apps/api
    container_name: pantrypal-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8181
      APP_ENV: production
      REDIS_URL: redis://pantrypal-redis:6379
      S3_ENDPOINT: http://pantrypal-minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-pantrypal}
      S3_FORCE_PATH_STYLE: "true"
      FFMPEG_PATH: ffmpeg
      FFPROBE_PATH: ffprobe
    depends_on:
      pantrypal-db:
        condition: service_healthy
      pantrypal-redis:
        condition: service_healthy
      pantrypal-minio:
        condition: service_healthy
    networks:
      - pantrypal-internal

  pantrypal-worker:
    build:
      context: ./apps/api
    container_name: pantrypal-worker
    restart: unless-stopped
    command: [ "node", "dist/worker.js" ]
    env_file:
      - .env
    environment:
      APP_ENV: production
      RUN_MIGRATIONS: "false"
      REDIS_URL: redis://pantrypal-redis:6379
      S3_ENDPOINT: http://pantrypal-minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-pantrypal}
      S3_FORCE_PATH_STYLE: "true"
      FFMPEG_PATH: ffmpeg
      FFPROBE_PATH: ffprobe
    depends_on:
      pantrypal-api:
        condition: service_started
      pantrypal-db:
        condition: service_healthy
      pantrypal-redis:
        condition: service_healthy
      pantrypal-minio:
        condition: service_healthy
    networks:
      - pantrypal-internal

  pantrypal-frontend:
    build:
      context: ./apps/client
      args:
        API_BASE_URL: ${API_BASE_URL:?Set API_BASE_URL in deploy/.env}
    container_name: pantrypal-frontend
    restart: unless-stopped
    depends_on:
      - pantrypal-api
    networks:
      - pantrypal-internal
      - adam-cloud

  pantrypal-db:
    image: postgres:17-alpine
    container_name: pantrypal-db
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pantrypal_postgres_data:/var/lib/postgresql/data
    networks:
      - pantrypal-internal

  pantrypal-redis:
    image: redis:7-alpine
    container_name: pantrypal-redis
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pantrypal_redis_data:/data
    networks:
      - pantrypal-internal

  pantrypal-minio:
    image: quay.io/minio/minio:latest
    container_name: pantrypal-minio
    restart: unless-stopped
    command: minio server /data
    env_file:
      - .env
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pantrypal_minio_data:/data
    networks:
      - pantrypal-internal

  pantrypal-minio-init:
    image: quay.io/minio/mc:latest
    container_name: pantrypal-minio-init
    depends_on:
      pantrypal-minio:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - pantrypal-internal
    entrypoint: >
      /bin/sh -c " mc alias set local http://pantrypal-minio:9000 \"$$S3_ACCESS_KEY\" \"$$S3_SECRET_KEY\" && mc mb --ignore-existing local/\"$${S3_BUCKET:-pantrypal}\" "

networks:
  pantrypal-internal:
    driver: bridge
  adam-cloud:
    external: true

volumes:
  pantrypal_postgres_data:
  pantrypal_redis_data:
  pantrypal_minio_data:
